# PoolTrack — Docker Compose
# Tahap 1: hanya service database (MariaDB).
# Service backend & frontend ditambahkan di Tahap 8.
#
# Nilai diambil dari file .env di folder ini (salin dari .env.example).
# Sintaks ${VAR:?pesan} membuat compose langsung gagal jika variabel belum diisi.

name: pooltrack

services:
  db:
    image: mariadb:11.4
    container_name: pooltrack-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi di .env}
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME belum diisi di .env}
      MARIADB_USER: ${DB_USER:?DB_USER belum diisi di .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}
    ports:
      - "${DB_PORT:?DB_PORT belum diisi di .env}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
